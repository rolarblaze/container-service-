name: Build and Push Docker Image to Amazon ECR

on:
  workflow_dispatch:
    
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: app-repo
  IMAGE_TAG: ${{ github.sha }} # Using the commit SHA as the image tag

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read 
      id-token: write # for OIDC authentication with AWS
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v4

      # - name: Configure AWS Credentials 
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECRPushRole
      #     aws-region: ${{ env.AWS_REGION }}
      # - name: Login to Amazon ECR 
      #   id: ecr-login
      #   uses: aws-actions/amazon-ecr-login@v2
      - name: Configure AWS Credentials for ECR Login 
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push Docker image to Amazon ECR
        env: 
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker buildx create --use 
          docker buildx build \ 
          --file ./src/Dockerfile \
          --platform linux/amd64 \ 
          --tag "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
          --push \
          ./src

          # confirm the image was pushed successfully
          echo "Image Build & pushed successfully: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
        shell: bash


      - name: Scan Image for Vulnerabilities 
        id: ecr-scan 
        continue-on-error: true
        run: |
          aws ecr start-image-scan \
            --repository-name $ECR_REPOSITORY \
            --image-id imageTag=${{steps.meta.outputs.sha_short }} \
            --region $AWS_REGION


