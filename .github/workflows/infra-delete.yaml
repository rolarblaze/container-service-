# ----------------------------------------#######----------------------------------------------------------
name: Terraform Deletion CI Pipeline

on: 
  workflow_dispatch:
    inputs: 
      confirm_destroy:
        description: 'Type "DESTROY" to confirm permanent deletion '
        required: true 
        type: choice 
        options: 
          - 'NO - cancel (safe)'
          - 'DESTROY - Delete Everything'
        default: 'NO - cancel (safe)'
      # environment:
      #   description: 'Which environment to destroy?'
      #   required: true 
      #   type: choice 
      #   options: 
      #     - 'dev'
      #     - 'staging'
env: 
  AWS_REGION: us-east-1
  TF_VERSION: 1.9
  TF_WORKING_DIR: .

jobs: 
  terraform-destroy:
    name: Destroy Infrastructure 
    runs-on: ubuntu-latest 
    if: github.event.inputs.confirm_destroy == 'DESTROY - Delete Everything'
    defaults:
      run: 
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS Credentials 
      - name: Verify AWS Credentials 
        run: |
          echo "---------------------------------------------"
          echo " AWS IDENTITY VERIFICATION "
          echo "---------------------------------------------"
          aws sts get-caller-identity 
          echo ""
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

      - name: Set Terraform 
        uses: hashicorp/setup-terraform@v3 
        with: 
          terraform_version: ${{ env.TF_VERSION }}
      # debug Show directory structures 
      - name: Debug - List Files 
        run: |
          echo "Current directory:"
          pwd 
          echo ""
          echo "Files"
          ls -al 
          echo ""
          echo "Terraform files:"
          find . -type f -name "*.tf" | head -20 
      # Terraform Init 
      - name: Terraform Init 
        run: terraform validate 

      # Show Current Resources 
      - name: Show Current Resources 
        run: | 
          echo "---------------------------------------------"
          echo " CURRENT RESOURCES "
          echo "---------------------------------------------"
          terraform state list || echo "No resources found in state"

      # Terraform Plan Destroy
      - name: Terraform Plan Destroy 
        run: |
          echo "---------------------------------------------"
          echo " RESOURCES TO BE DESTROYED "
          echo "---------------------------------------------"
          terraform show destroy.tfplan 
      - name: final Warning 
        run: | 
          echo "---------------------------------------------"
          echo " FINAL WARNING "
          echo "You are about to permanently DESTROY ALL RESOURCES in the ${{ github.event.inputs.environment }} environment!"
          echo " Environment: ${{ github.event.inputs.environment}}"
          echo "This action cannot be undone."
          echo "If you are sure, please type DESTROY in the next step to proceed."
          echo "---------------------------------------------"
          sleep 10  # 10 seconds for user to abort 
      - name: Execute Terraform destroy 
        run: terraform apply -auto-approve destroy.tfplan

      - name: Verify Destruction Complete 
        run: | 
          echo "---------------------------------------------"
          echo " FINAL WARNING "
          echo "---------------------------------------------"
          echo ""
          echo " Remaining resources:"
          terraform state list || echo "All resources destroyed successfully!"
          echo ""
          echo "Destroyed by: ${{ github.actor }}"
          echo "Timestamp: $(date -u)"

      
# ✅ Update summary 
      - name: Create Summary 
        if: always() 
        run: |  
          echo "## 💥 Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY  
          echo "" >> $GITHUB_STEP_SUMMARY  
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Destroyed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY  
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY  
          echo "" >> $GITHUB_STEP_SUMMARY  
          echo "### Resources Destroyed" >> $GITHUB_STEP_SUMMARY  
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY  terraform show destroy.tfplan | grep -A 1000 "Plan:" || echo "Plan details unavailable" >> $GITHUB_STEP_SUMMARY  
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
